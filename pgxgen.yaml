version: 1
sqlc:
  - schema_dir: sql/migrations
    models:
      replace_sqlc_nullable_types: true
      move:
        output_dir: internal/models
        output_file_name: models_gen.go
        package_name: models
        package_path: github.com/sxwebdev/sentinel/internal/models
        imports:
          - path: github.com/sxwebdev/sentinel/internal/models
            go_type: ServiceProtocolType
          - path: github.com/sxwebdev/sentinel/internal/models
            go_type: ServiceStatus
          - path: github.com/sxwebdev/sentinel/internal/models
            go_type: NotificationProviderType
    crud:
      auto_remove_generated_files: true
      exclude_table_name_from_methods: true
      tables:
        # agents
        agents:
          output_dir: sql/queries/agents
          primary_column: id
          methods:
            create:
              skip_columns:
                - fingerprint
                - is_enabled
                - status
                - system_info
                - last_seen_at
                - created_at
                - updated_at
              returning: "*"
              column_values:
                created_at: CURRENT_TIMESTAMP
            delete:
            get:
              name: GetByID

        # Services
        services:
          output_dir: sql/queries/services
          primary_column: id
          methods:
            create:
              skip_columns:
                - created_at
                - updated_at
              returning: "*"
            delete:
            get:
              name: GetByID

        # service_states
        service_states:
          output_dir: sql/queries/service_states
          primary_column: id
          methods:
            create:
              skip_columns:
                - created_at
                - updated_at
              returning: "*"
            delete:
            get:
              name: GetByID
            find:
              name: GetAll

        # incidents
        incidents:
          output_dir: sql/queries/incidents
          primary_column: id
          methods:
            create:
              skip_columns:
                - duration
                - started_at
                - resolved_at
                - updated_at
                - created_at
              returning: "*"
              column_values:
                error: sqlc.arg(incident_error)
            delete:
            get:
              name: GetByID

        # incident_states
        incident_states:
          output_dir: sql/queries/incident_states
          primary_column: id
          methods:
            create:
              skip_columns:
                - created_at
                - updated_at
              returning: "*"
            delete:
            get:
              name: GetByID
            find:
              name: GetAll

        # notification_providers
        notification_providers:
          output_dir: sql/queries/notification_providers
          primary_column: id
          methods:
            create:
              skip_columns:
                - is_enabled
                - created_at
                - updated_at
              returning: "*"
            delete:
            get:
              name: GetByID
            find:
              name: GetAll

        # notification_history
        notification_history:
          output_dir: sql/queries/notification_history
          primary_column: id
          methods:
            create:
              skip_columns:
                - status
                - response
                - attempts
                - error_message
                - last_attempt_at
                - sent_at
                - created_at
                - updated_at
              returning: "*"
            delete:

    constants:
      tables:
        agents:
          output_dir: internal/store/repos/repo_agents
          include_column_names: true
        services:
          output_dir: internal/store/repos/repo_services
          include_column_names: true
        service_states:
          output_dir: internal/store/repos/repo_service_states
          include_column_names: true
        incidents:
          output_dir: internal/store/repos/repo_incidents
          include_column_names: true
        incident_states:
          output_dir: internal/store/repos/repo_incident_states
          include_column_names: true
        notification_providers:
          output_dir: internal/store/repos/repo_notification_providers
          include_column_names: true
        notification_history:
          output_dir: internal/store/repos/repo_notification_history
          include_column_names: true
