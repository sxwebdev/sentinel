version: "2"
overrides:
  go:
    overrides:
      - db_type: jsonb
        go_type:
          type: JSONField
          import: github.com/sxwebdev/sentinel/internal/store/storecmn

      # Services
      - column: services.protocol
        go_type:
          type: ServiceProtocolType

      # service_states
      - column: service_states.status
        go_type:
          type: ServiceStatus

      # notification_providers
      - column: notification_providers.provider_type
        go_type:
          type: NotificationProviderType
      - column: notification_providers.config
        go_type:
          type: JSONField
          import: github.com/sxwebdev/sentinel/internal/store/storecmn

      # notification_history
      - column: notification_history.incident_id
        go_type:
          type: "*string"

sql:
  # Services
  - schema: sql/migrations
    queries: sql/queries/services
    engine: sqlite
    gen:
      go:
        out: internal/store/repos/repo_services
        emit_prepared_queries: false
        emit_json_tags: true
        emit_exported_queries: false
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        query_parameter_limit: 3

