version: "2"
overrides:
  go:
    overrides:
      # Services
      - db_type: jsonb
        go_type:
          type: JSONField
          import: github.com/sxwebdev/sentinel/internal/store/storecmn
      - column: services.protocol
        go_type:
          type: ServiceProtocolType
      - column: services.interval
        go_type:
          type: Duration
          import: github.com/sxwebdev/sentinel/internal/store/storecmn
      - column: services.timeout
        go_type:
          type: Duration
          import: github.com/sxwebdev/sentinel/internal/store/storecmn

      # service_states
      - column: service_states.status
        go_type:
          type: ServiceStatus
sql:
  # Services
  - schema: sql/migrations
    queries: sql/queries/services
    engine: sqlite
    gen:
      go:
        out: internal/store/repos/repo_services
        emit_prepared_queries: false
        emit_json_tags: true
        emit_exported_queries: false
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        query_parameter_limit: 3

  # service_states
  - schema: sql/migrations
    queries: sql/queries/service_states
    engine: sqlite
    gen:
      go:
        out: internal/store/repos/repo_service_states
        emit_prepared_queries: false
        emit_json_tags: true
        emit_exported_queries: false
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        query_parameter_limit: 3

  # incidents
  - schema: sql/migrations
    queries: sql/queries/incidents
    engine: sqlite
    gen:
      go:
        out: internal/store/repos/repo_incidents
        emit_prepared_queries: false
        emit_json_tags: true
        emit_exported_queries: false
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        query_parameter_limit: 3

  # agents
  - schema: sql/migrations
    queries: sql/queries/agents
    engine: sqlite
    gen:
      go:
        out: internal/store/repos/repo_agents
        emit_prepared_queries: false
        emit_json_tags: true
        emit_exported_queries: false
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        query_parameter_limit: 3
