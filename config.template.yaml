log:
  format: json
  level: info
  console_colored: false
  trace: fatal
  with_caller: false
  with_stack_trace: false
ops:
  enabled: false
  network: tcp
  tracing_enabled: false
  metrics:
    enabled: false
    path: /metrics
    port: "10000"
    basic_auth:
      enabled: false
      username: ""
      password: ""
  healthy:
    enabled: false
    path: /healthy
    port: "10000"
  profiler:
    enabled: false
    path: /debug/pprof
    port: "10000"
    write_timeout: 60
data_dir: ./data
server:
  port: 8080
  host: 0.0.0.0
  base_host: localhost:8080
  frontend:
    base_url: http://localhost:8080/api/v1
    socket_url: ws://localhost:8080/ws
  auth:
    enabled: false
    users: []
monitoring:
  global:
    default_interval: 1m0s
    default_timeout: 10s
    default_retries: 10
database:
  path: ./data/db.sqlite
notifications:
  enabled: false
  urls: []
timezone: UTC
upgrader:
  is_enabled: false
  command: ""
